[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-crawler"
version = "0.1.0"
description = "Multi-process Telegram crawler for discovering and archiving t.me groups and channels."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Simone Galota" }]
dependencies = [
    "telethon>=1.30",
    "pymongo>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Analysis & visualisation scripts under plots/
analysis = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.scripts]
telegram-crawler = "telegram_crawler.__main__:main"

[tool.setuptools.packages.find]
include = ["telegram_crawler*"]
exclude = ["plots*", "tests*"]
